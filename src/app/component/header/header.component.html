<div class="header-layout">
  <div class="login-layout">
    @if (userService.isLoggedIn()) {
      <button class="no-background" mat-button (click)="user('user')">
        {{ userService.userName() || 'Account' }}
        <mat-icon iconPositionEnd>person</mat-icon>
      </button>
    } @else {
      <button class="no-background" mat-button (click)="user('login')">Login</button>
      <span>|</span>
      <button class="no-background" mat-button (click)="user('register')">Register</button>
    }
  </div>
  <div class="logo-container">
    <img class="logo-style" src="assets/ep.png" alt="Essensplan logo" />
  </div>
</div>
