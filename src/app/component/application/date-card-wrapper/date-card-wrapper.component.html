<div class="week">
  <button mat-icon-button aria-label="Previous week" (click)="fillWeekFromNow(-1)">
    <mat-icon>arrow_back_ios</mat-icon>
  </button>

  <div class="calendar-container">
    @for (card of dateCards(); track card.date.getTime(); let i = $index) {
      <app-date-card
        [dateCard]="card"
        [selected]="selectedCard() === i"
        (click)="selectedCard.set(i)"
      >
      </app-date-card>
    }
  </div>

  <button mat-icon-button aria-label="Next week" (click)="fillWeekFromNow(1)">
    <mat-icon>arrow_forward_ios</mat-icon>
  </button>
</div>
