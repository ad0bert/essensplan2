<mat-card
  class="mat-card-style"
  [class.selected-style]="selected()"
  [class.today-style]="isToday()"
>
  <div class="date-container">
    <span>{{ dateCard().date | date: 'fullDate' }}</span>
  </div>
  <mat-divider></mat-divider>
  <div class="dishes-container">
    @for (dish of dateCard().dishes; track $index) {
      <div class="dish-container">{{ dish }}</div>
    }
  </div>
  <mat-divider></mat-divider>
  <div class="card-button-wrapper">
    <button mat-icon-button class="card-button" aria-label="Add dish" (click)="addDish()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</mat-card>
