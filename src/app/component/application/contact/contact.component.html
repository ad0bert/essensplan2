<div class="contact-container">
  <mat-card class="contact-card">
    <h1 class="h1-style">Contact</h1>
    <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <mat-form-field>
        <mat-label>Your E-Mail</mat-label>
        <input formControlName="email" type="email" matInput autocomplete="email" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Subject</mat-label>
        <input formControlName="subject" matInput />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Message</mat-label>
        <textarea formControlName="textarea" matInput rows="5"></textarea>
      </mat-form-field>
      <p>
        The sent data will only be processed for the purpose of processing your request.<br />
        You can find further information in our
        <a routerLink="/about" fragment="datenschutz-en">privacy policy</a>.
      </p>
      <div>
        <button type="submit" [disabled]="contactForm.invalid" class="submit-btn" mat-flat-button>
          Submit
        </button>
      </div>
    </form>
  </mat-card>
</div>
