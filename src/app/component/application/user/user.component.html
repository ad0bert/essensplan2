@switch (type()) {
  @case ('login') {
    <app-login (changeType)="onChangeType($event)" (dialogClose)="onDialogClose()"></app-login>
  }
  @case ('register') {
    <app-register
      (changeType)="onChangeType($event)"
      (dialogClose)="onDialogClose()"
    ></app-register>
  }
  @default {
    <app-account (dialogClose)="onDialogClose()"></app-account>
  }
}
