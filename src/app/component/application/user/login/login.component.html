<h1 class="h1-style">Login</h1>
<form class="user-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>E-Mail or Username</mat-label>
    <input formControlName="email" matInput autocomplete="username" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password</mat-label>
    <input formControlName="password" type="password" matInput autocomplete="current-password" />
  </mat-form-field>
  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }
  <div class="form-footer">
    <button type="button" class="change-ref" (click)="changeType.emit('register')">
      Don't have an account?
    </button>
    <button
      type="submit"
      [disabled]="loginForm.invalid || submitting()"
      class="login-btn"
      mat-flat-button
    >
      Login
    </button>
  </div>
</form>
